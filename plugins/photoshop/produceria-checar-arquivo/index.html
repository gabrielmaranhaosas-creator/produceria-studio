<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-size: 12px; padding: 8px; }
    label { display: block; margin: 6px 0 2px; }
    select, button { width: 100%; margin-bottom: 6px; }
    #resumo { margin: 8px 0; font-weight: bold; }
    .item { margin: 4px 0; padding: 4px 0; border-bottom: 1px solid #77777755; }
    .tag { font-weight: bold; }
  </style>
</head>
<body>
  <label for="destino">Destino do arquivo</label>
  <select id="destino">
    <option value="impressao">Impressão (CMYK, 300 ppi)</option>
    <option value="digital">Digital (RGB, 72 ppi ou mais)</option>
  </select>
  <button id="btnChecar">Checar arquivo</button>
  <div id="resumo"></div>
  <div id="resultado"></div>
</body>
</html>
