<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-size: 12px; padding: 8px; }
    label { display: block; margin: 6px 0 2px; }
    select, input, button { width: 100%; margin-bottom: 6px; }
    #resumo { margin: 8px 0; font-weight: bold; }
    .item { margin: 4px 0; padding: 4px 0; border-bottom: 1px solid #77777755; }
    .tag { font-weight: bold; }
  </style>
</head>
<body>
  <label for="destino">Destino do arquivo</label>
  <select id="destino">
    <option value="impressao">Impressão (CMYK, 300 ppi)</option>
    <option value="digital">Digital (RGB e dimensões do job em pixels)</option>
  </select>
  <label for="larguraAlvo">Largura esperada em pixels (opcional; digital)</label><input type="number" id="larguraAlvo" min="1" max="30000">
  <label for="alturaAlvo">Altura esperada em pixels (opcional; digital)</label><input type="number" id="alturaAlvo" min="1" max="30000">
  <button id="btnChecar">Checar arquivo</button>
  <div id="resumo" role="status" aria-live="polite"></div>
  <div id="resultado"></div>
  <script src="index.js"></script>
</body>
</html>
